  :root {
    --bg: #0a0a0a;
    --fg: #f5f5f5;
    --muted: #8a8a8a;
    --line: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(60% 50% at 50% 0%, rgba(255,255,255,0.07), transparent 70%);
    pointer-events: none;
  }
  main {
    position: relative;
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 28px;
  }
  h1 {
    font-size: clamp(28px, 6.5vw, 44px);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 18px;
  }
  .lede {
    font-size: clamp(15px, 2.4vw, 17px);
    line-height: 1.6;
    color: var(--muted);
    margin: 0 auto 36px;
    max-width: 40ch;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .cta:hover, .cta:focus-visible {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.32);
    transform: translateY(-1px);
  }
  .cta .arrow { transition: transform 0.2s ease; }
  .cta:hover .arrow, .cta:focus-visible .arrow { transform: translateX(3px); }
  .socials {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 26px;
    margin-top: 64px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }
  .socials a {
    color: var(--muted);
    display: inline-flex;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .socials a:hover, .socials a:focus-visible {
    color: var(--fg);
    transform: translateY(-2px);
  }
  .socials svg { width: 22px; height: 22px; display: block; }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #5c5c5c;
  }
  @media (max-width: 380px) {
    .socials { gap: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cta, .cta .arrow, .socials a { transition: none; }
  }
